<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shift Happens · When code becomes cheap</title>
  <meta name="description" content="Shift Happens: When code becomes cheap. A 30-minute hackathon talk by Sandro Lovnički.">
  <link rel="icon" href="https://sciply.com/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/engine.css">
  <link rel="stylesheet" href="styles/layouts.css">

  <script>
    // Slide registry. Each data/*.js file calls defineSection(meta, slides);
    // slides are shown in the order the <script> tags below are loaded.
    window.SLIDES = [];
    window.defineSection = function (meta, slides) {
      slides.forEach(function (s) {
        window.SLIDES.push(Object.assign({ section: meta.title, sectionMeta: meta }, s));
      });
    };
  </script>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>

  <main class="viewport">
    <div class="stage" aria-live="polite"></div>
  </main>

  <div class="counter" aria-hidden="true"></div>
  <div class="hint" aria-hidden="true"><kbd>→</kbd> next · <kbd>O</kbd> overview · <kbd>N</kbd> notes · <kbd>F</kbd> fullscreen</div>

  <aside class="notes" aria-label="Speaker notes">
    <div class="notes__body"></div>
    <div class="notes__aside"></div>
  </aside>

  <div class="overview" aria-label="All slides">
    <div class="overview__grid"></div>
  </div>

  <!-- Content: reorder these to reorder whole sections -->
  <script src="data/intro-slides.js"></script>
  <script src="data/ai-history.js"></script>
  <script src="data/qa-slides.js"></script>

  <!-- Engine -->
  <script src="js/renderers.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
